name: Build THE FLIP APK
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: 'temurin', java-version: '17'}
      - run: |
          mkdir -p app/src/main/assets
          cp index.html app/src/main/assets/
          cp style.css app/src/main/assets/
          cp app.js app/src/main/assets/
      - uses: gradle/gradle-build-action@v2
        with: {arguments: assembleDebug}
      - uses: actions/upload-artifact@v4
        with: {name: the-flip-apk, path: app/build/outputs/apk/debug/app-debug.apk}