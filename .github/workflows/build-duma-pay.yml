name: Build DUMA Pay APK

on:
  push:
    branches: [duma-pay-v1, duma-pay-sa-phase1]
    paths:
      - 'app/**'
      - 'build.gradle'
      - 'settings.gradle'
      - '.github/workflows/build-duma-pay.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Prepare official DUMA PAY brand assets
        run: |
          sudo apt-get update
          sudo apt-get install -y imagemagick
          mkdir -p app/src/main/res/drawable-nodpi
          curl -fL https://raw.githubusercontent.com/doctorzuza22-pixel/DUMA-Browser/main/app/src/main/res/drawable-nodpi/duma_logo.jpg -o /tmp/duma_logo_original.jpg
          convert -size 900x360 xc:none /tmp/duma_logo_original.jpg -resize 340x340 -gravity west -geometry +20+0 -composite -font DejaVu-Sans-Bold -pointsize 126 -fill '#12345a' -gravity west -annotate +405+38 'PAY' app/src/main/assets/duma_pay_brand.png
          convert -size 512x512 xc:white /tmp/duma_logo_original.jpg -resize 320x320 -gravity west -geometry +8+0 -composite -font DejaVu-Sans-Bold -pointsize 72 -fill '#12345a' -gravity east -annotate +12+0 'PAY' app/src/main/res/drawable-nodpi/duma_pay_icon.png
      - name: Build debug APK
        uses: gradle/gradle-build-action@v3
        with:
          gradle-version: '8.2.1'
          arguments: assembleDebug --no-daemon
      - name: Upload DUMA Pay APK
        uses: actions/upload-artifact@v4
        with:
          name: DUMA-Pay-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
